<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Guide the Ball</title>
<style>
  :root{
    --bg:#0d1022; --panel:#181c33; --panel-2:#212745; --ink:#e9ecff; --muted:#9099c2;
    --obstacle:#ff4d5e; --target:#2fd97a; --ramp:#3ec8ff; --wall:#93a0b8;
    --ball:#ffffff; --accent:#ffc93c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(120% 80% at 50% 0%, #1c2145 0%, var(--bg) 65%);
    color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;align-items:flex-start;padding:10px;overscroll-behavior:none;
  }
  .app{width:min(430px,100%);display:flex;flex-direction:column;gap:9px}

  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .title{font-size:15px;font-weight:700;letter-spacing:.02em;min-width:0}
  .title span{color:var(--muted);font-weight:500}
  .counter{background:var(--panel);border:1px solid #2c3358;border-radius:999px;
           padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .counter b{color:var(--accent);font-variant-numeric:tabular-nums}

  .stage{position:relative;width:100%;border-radius:14px;overflow:hidden;
         border:1px solid #2c3358;box-shadow:0 10px 34px rgba(0,0,0,.45)}
  canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}

  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:rgba(8,10,22,.72);backdrop-filter:blur(3px);padding:18px}
  /* class sets display:flex, which would otherwise beat the UA [hidden] rule */
  .overlay[hidden]{display:none}
  .card{background:var(--panel);border:1px solid #333b66;border-radius:16px;
        padding:20px 18px;text-align:center;width:100%;max-width:290px;
        box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .card .big{font-size:24px;font-weight:800;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .card .row{display:flex;gap:8px}
  .win .big{color:var(--target)}
  .lose .big{color:var(--obstacle)}

  button{font:inherit;font-weight:650;color:var(--ink);background:var(--panel-2);
         border:1px solid #39416e;border-radius:11px;padding:11px 12px;cursor:pointer;
         flex:1;transition:filter .12s,transform .06s}
  button:hover:not(:disabled){filter:brightness(1.18)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.38;cursor:not-allowed}
  button[hidden]{display:none}
  .primary{background:linear-gradient(180deg,#4a8cff,#2f6ae0);border-color:#5f9bff}
  .controls{display:flex;gap:8px}
  .controls .primary{flex:1.6}

  .legend{background:var(--panel);border:1px solid #2c3358;border-radius:12px;
          padding:9px 11px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
  .legend i{display:inline-flex;align-items:center;gap:7px;font-style:normal;color:#cdd4f5}
  .sw{width:15px;height:15px;flex:none;display:block}
  .sw.ob{border-radius:50%;background:var(--obstacle);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
  .sw.tg{border-radius:3px;background:rgba(47,217,122,.28);border:2px solid var(--target)}
  .sw.rp{height:6px;width:18px;border-radius:3px;background:var(--ramp);transform:rotate(-20deg)}
  .sw.wl{height:6px;width:18px;border-radius:3px;background:var(--wall)}
  .sw.bl{border-radius:50%;background:var(--ball)}
  .hint{color:var(--muted);font-size:12.5px;text-align:center;margin:0}

  button.title{background:none;border:0;padding:0;flex:0 1 auto;text-align:left;
               cursor:pointer;font-size:15px;font-weight:700;color:var(--ink)}
  button.title:after{content:' \25BE';color:var(--muted);font-size:12px}
  .selcard{max-width:330px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
  .grid button{flex:none;padding:10px 0;font-size:13px;font-variant-numeric:tabular-nums}
  .grid button.done{border-color:#2fd97a;color:#8dffbe}
  .grid button.cur{background:linear-gradient(180deg,#4a8cff,#2f6ae0);border-color:#5f9bff}
  .grid button:disabled{opacity:.3}
</style>
</head>
<body>
<div class="app">

  <div class="hud">
    <button class="title" id="level-title" title="Choose a level">Guide the Ball</button>
    <div class="counter">Ramps left: <b id="ramps-left">1</b></div>
  </div>

  <div class="stage">
    <canvas id="board" aria-label="Game board"></canvas>
    <div class="overlay" id="select" hidden>
      <div class="card selcard">
        <div class="big">Levels</div>
        <div class="sub" id="sel-sub">Cleared levels stay unlocked.</div>
        <div class="grid" id="lvgrid"></div>
        <div class="row"><button id="btn-close-sel">Close</button></div>
      </div>
    </div>
    <div class="overlay" id="overlay" hidden>
      <div class="card" id="card">
        <div class="big" id="ov-title">Target hit!</div>
        <div class="sub" id="ov-sub"></div>
        <div class="row">
          <button id="btn-retry">Retry</button>
          <button id="btn-adjust">Adjust</button>
          <button id="btn-next" class="primary" hidden>Next</button>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="btn-drop" class="primary">Drop Ball</button>
    <button id="btn-undo">Undo</button>
    <button id="btn-clear">Clear</button>
  </div>

  <div class="legend">
    <i><span class="sw tg"></span>Green box = Target (goal)</i>
    <i><span class="sw ob"></span>Red circle = Obstacle (random bounce)</i>
    <i><span class="sw rp"></span>Blue bar = Your ramp</i>
    <i><span class="sw wl"></span>Grey bar = Wall (fixed, blocks the ball)</i>
    <i><span class="sw bl"></span>White = Ball</i>
  </div>

  <p class="hint" id="hint">Drag on the board to draw a ramp, then press Drop Ball.</p>
</div>

<script>
(function(){
'use strict';

/* ============================================================
   PHYSICS CONSTANTS
   The ball's SPEED is fixed for the whole drop. Only its
   direction ever changes - and only when it hits something.
   ============================================================ */
const W = 480, H = 800;              // logical board size (portrait, 3:5)
const BALL_R    = 9;
const SPEED     = 8.75;              // px per 1/60s step - never changes
// CURVE is how hard gravity bends the ball's direction. At 0 the ball travels
// in perfectly straight lines and only ever changes direction when it hits
// something - a ramp sets an angle and the ball holds it.
const CURVE     = 0;
const GRAV_BIAS = CURVE * SPEED * SPEED;
const RAMP_HT   = 4.5;               // player ramp half-thickness
const WALL_HT   = 5;                 // static wall half-thickness
// Enough substeps that the ball never advances more than ~1.5px at a time,
// however fast it is going - otherwise it tunnels through thin segments.
const SUBSTEPS  = Math.max(5, Math.ceil(SPEED / 1.5));
const MAX_STEPS = 60 * 14;           // 14s of bouncing, then it's a loss
const MIN_RAMP  = 28, MAX_RAMP = 160;
// Obstacle bounces mirror off the circle like a real bounce, then scatter by
// up to OB_JITTER. OB_MAX_DEV keeps the result pointing away from the circle
// so the ball can never bounce back into the thing it just hit.
const OB_JITTER  = 32 * Math.PI / 180;
const OB_MAX_DEV = 78 * Math.PI / 180;

/* ============================================================
   LEVELS
   Each: id, name, maxBlocks, spawn, obstacles, target, targetType.
   Wall segments are generated from targetType by buildWalls() and
   are REAL collidable geometry - see resolveCollisions().
   ============================================================ */
const LEVELS = [
  /* =============== Act 1 - Learn to Aim (open targets) ===============
     Spawn/target sides deliberately alternate so no two boards feel alike. */

  // 1. spawn left  -> target low-right.  Simplest possible case.
  { id:1, name:'First Drop', maxBlocks:1, targetType:'OPEN',
    spawn:{x:140,y:40}, obstacles:[], target:{x:330,y:686,r:46} },

  // 2. spawn right -> target low-left.  Mirrors level 1, longer reach.
  { id:2, name:'Long Reach', maxBlocks:1, targetType:'OPEN',
    spawn:{x:372,y:40}, obstacles:[], target:{x:118,y:700,r:42} },

  // 3. spawn centre -> target far left and HIGHER up the board.
  { id:3, name:'Watch Out', maxBlocks:1, targetType:'OPEN',
    spawn:{x:232,y:40}, obstacles:[{x:170,y:452,r:36}], target:{x:92,y:636,r:27} },

  // 4. spawn far left -> target far right, the longest traverse yet.
  { id:4, name:'Two Steps', maxBlocks:2, targetType:'OPEN',
    spawn:{x:68,y:40}, obstacles:[], target:{x:398,y:712,r:38} },

  // 5. spawn right -> target left, obstacle sitting on the obvious line.
  { id:5, name:'Around It', maxBlocks:2, targetType:'OPEN',
    spawn:{x:344,y:40}, obstacles:[{x:250,y:560,r:52}], target:{x:140,y:664,r:40} },

  /* =============== Act 2 - Dodge and Guide (obstacle-focused) =============== */

  // 6. thread the lane between two obstacles, target high-right.
  { id:6, name:'The Gap', maxBlocks:2, targetType:'OPEN',
    spawn:{x:120,y:40}, obstacles:[{x:214,y:424,r:36},{x:356,y:424,r:36}],
    target:{x:368,y:604,r:40} },

  // 7. precision spike - budget DROPS to one ramp.
  { id:7, name:'One Shot', maxBlocks:1, targetType:'OPEN',
    spawn:{x:404,y:40}, obstacles:[{x:300,y:404,r:40},{x:152,y:560,r:36}],
    target:{x:196,y:700,r:22} },

  // 8. obstacles clustered mid-board; go around via the side.
  { id:8, name:'Staircase', maxBlocks:3, targetType:'OPEN',
    spawn:{x:240,y:40}, obstacles:[{x:228,y:420,r:44},{x:282,y:524,r:42}],
    target:{x:426,y:620,r:46} },

  // 9. loose vertical line of three - real clip risk on the way down.
  { id:9, name:'Tight Corridor', maxBlocks:2, targetType:'OPEN',
    spawn:{x:84,y:40}, obstacles:[{x:206,y:300,r:32},{x:214,y:440,r:32},{x:206,y:580,r:32}],
    target:{x:300,y:716,r:40} },

  // 10. corner to opposite corner, target high on the far side.
  { id:10, name:'Cross Court', maxBlocks:2, targetType:'OPEN',
    spawn:{x:428,y:40}, obstacles:[{x:296,y:430,r:38},{x:170,y:302,r:36}],
    target:{x:60,y:628,r:40} },

  /* =============== Act 3 - Threading the Needle (walls) =============== */

  // 11. SIDE_WALL alone, no obstacles: isolate the new mechanic.
  { id:11, name:'One Way In', maxBlocks:2, targetType:'SIDE_WALL', wallSide:'left',
    spawn:{x:156,y:40}, obstacles:[], target:{x:392,y:668,r:40} },

  // 12. POCKET guarded on the right; spawn is on the right, so come around.
  { id:12, name:'The Pocket', maxBlocks:2, targetType:'POCKET', wallSide:'right',
    spawn:{x:396,y:40}, obstacles:[{x:330,y:470,r:38}], target:{x:250,y:690,r:46} },

  // 13. first NARROW_GAP, target high-left.
  { id:13, name:'Threading It', maxBlocks:3, targetType:'NARROW_GAP', gapW:52,
    spawn:{x:260,y:40}, obstacles:[{x:180,y:420,r:36}], target:{x:94,y:596,r:38} },

  // 14. NARROW_GAP again, budget drops to two and the gap narrows.
  { id:14, name:'Steady Hands', maxBlocks:2, targetType:'NARROW_GAP', gapW:44,
    spawn:{x:96,y:40}, obstacles:[{x:222,y:380,r:36},{x:304,y:520,r:34}],
    target:{x:352,y:736,r:38} },

  // 15. the cup: only a near-vertical drop gets in.
  { id:15, name:'The Basket', maxBlocks:3, targetType:'ENCLOSED',
    spawn:{x:384,y:40}, obstacles:[{x:300,y:398,r:38},{x:140,y:500,r:36}],
    target:{x:200,y:648,r:40} },

  /* =============== Act 4 - Guide Master =============== */

  // 16. back to OPEN - an obstacle-weaving showcase, stationary.
  { id:16, name:'Breather', maxBlocks:2, targetType:'OPEN',
    spawn:{x:216,y:40}, obstacles:[{x:302,y:340,r:34},{x:248,y:482,r:36},{x:370,y:566,r:32}],
    target:{x:286,y:596,r:46} },

  // 17. FIRST MOVING TARGET - slow, short glide, plus its SIDE_WALL.
  { id:17, name:'Full House', maxBlocks:3, targetType:'SIDE_WALL', wallSide:'left',
    spawn:{x:128,y:40}, obstacles:[{x:240,y:380,r:36},{x:330,y:502,r:34}],
    target:{x:300,y:660,r:46},
    move:{ points:[{x:300,y:660},{x:392,y:660}], speed:32 } },

  // 18. stationary on purpose - precision without timing, for pacing.
  { id:18, name:'No Room', maxBlocks:2, targetType:'NARROW_GAP', gapW:38,
    spawn:{x:400,y:40}, obstacles:[{x:300,y:360,r:36},{x:232,y:482,r:34},{x:118,y:462,r:32}],
    target:{x:128,y:566,r:38} },

  // 19. moving faster and further, busiest board in the set.
  { id:19, name:'The Gauntlet', maxBlocks:3, targetType:'POCKET', wallSide:'right',
    spawn:{x:248,y:40},
    obstacles:[{x:158,y:320,r:32},{x:302,y:360,r:34},{x:198,y:470,r:34},{x:344,y:520,r:32}],
    target:{x:150,y:726,r:44},
    move:{ points:[{x:150,y:726},{x:356,y:726}], speed:60 } },

  // 20. finale - three waypoints, so the path is longer and less predictable.
  { id:20, name:"Master's Drop", maxBlocks:3, targetType:'ENCLOSED',
    spawn:{x:92,y:40},
    obstacles:[{x:200,y:330,r:34},{x:332,y:430,r:34},{x:152,y:452,r:32}],
    target:{x:170,y:620,r:34},
    move:{ points:[{x:170,y:620},{x:270,y:560},{x:366,y:620}], speed:110 } }
];

/* ---------- target motion ----------
   A moving target glides in STRAIGHT LINES between fixed waypoints at a
   constant speed, looping A->B->A for two points or A->B->C->A for three.
   Pure linear interpolation - nothing in this game rotates or orbits.
   Position is a function of time, evaluated every frame during planning as
   well as during the drop, so the player can watch the path before committing.
   Motion parameters live in each level's `move` block, never inline. */
function initMove(lv){
  if (!lv.move) return;
  const pts = lv.move.points;
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const L = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ ax:a.x, ay:a.y, dx:b.x - a.x, dy:b.y - a.y, L:L });
    total += L;
  }
  lv.move.segs = segs;
  lv.move.total = total;
  lv.target.x = pts[0].x; lv.target.y = pts[0].y;   // base position = first waypoint
}
function targetAt(lv, t){
  const m = lv.move;
  if (!m) return lv.target;
  let d = (m.speed * t) % m.total;
  if (d < 0) d += m.total;
  for (let i = 0; i < m.segs.length; i++){
    const sg = m.segs[i];
    if (d <= sg.L || i === m.segs.length - 1){
      const k = sg.L ? clamp(d / sg.L, 0, 1) : 0;
      return { x: sg.ax + sg.dx * k, y: sg.ay + sg.dy * k, r: lv.target.r };
    }
    d -= sg.L;
  }
  return lv.target;
}

/* Build the static wall segments around a CIRCULAR target centred at c.
   OPEN        - nothing.
   SIDE_WALL   - one tall bar guarding a side; entry must come from elsewhere.
   POCKET      - an L (one side + a lid), so entry must be from the open side.
   NARROW_GAP  - bars on both sides plus a lid with a single small opening.
   ENCLOSED    - both sides + a floor, open only at the top: a cup.
   Walls are rebuilt from the target's CURRENT centre, so they travel with a
   moving target instead of being left behind. */
function buildWalls(lv, c){
  c = c || lv.target;
  const d  = c.r + 16;                        // standoff from the outer ring
  const up = lv.wallH || 112;                 // how far side bars rise
  const side = lv.wallSide || 'left';
  const seg = (x1,y1,x2,y2) => ({ x1:x1, y1:y1, x2:x2, y2:y2 });
  switch (lv.targetType){
    case 'SIDE_WALL':
      return side === 'left' ? [ seg(c.x-d, c.y+d, c.x-d, c.y-up) ]
                             : [ seg(c.x+d, c.y+d, c.x+d, c.y-up) ];
    case 'POCKET':
      return side === 'left'
        ? [ seg(c.x-d, c.y+d, c.x-d, c.y-d), seg(c.x-d, c.y-d, c.x+d, c.y-d) ]
        : [ seg(c.x+d, c.y+d, c.x+d, c.y-d), seg(c.x-d, c.y-d, c.x+d, c.y-d) ];
    case 'NARROW_GAP': {
      // gapW is the CLEAR window the ball centre can pass through, not the raw
      // span between bars - the bar ends are pushed out by the ball radius and
      // the wall thickness so the number means what it says when tuning.
      const gx = c.x + (lv.gapX || 0);
      const half = (lv.gapW || 46) / 2 + WALL_HT + BALL_R;
      return [ seg(c.x-d, c.y+d, c.x-d, c.y-up), seg(c.x+d, c.y+d, c.x+d, c.y-up),
               seg(c.x-d, c.y-d, gx-half, c.y-d), seg(gx+half, c.y-d, c.x+d, c.y-d) ];
    }
    case 'ENCLOSED':
      return [ seg(c.x-d, c.y+d, c.x-d, c.y-up), seg(c.x+d, c.y+d, c.x+d, c.y-up),
               seg(c.x-d, c.y+d, c.x+d, c.y+d) ];
    default:
      return [];
  }
}
// static levels can cache their walls; moving ones rebuild each step
LEVELS.forEach(function(lv){ initMove(lv); lv.walls = buildWalls(lv, lv.target); });

/* ---------------- math helpers ---------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function closestOnSeg(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px - x1)*dx + (py - y1)*dy) / len2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return { x: x1 + t*dx, y: y1 + t*dy };
}
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }

/* ============================================================
   SIMULATION - pure, no rendering. Shared by the live game and
   the headless solver sweep in the test harness.
   ============================================================ */
function makeBall(lv, seed, t0){
  return {
    t0: t0 || 0,                           // target-motion phase when the drop began
    x: lv.spawn.x, y: lv.spawn.y,
    px: lv.spawn.x, py: lv.spawn.y,        // previous step, for render interpolation
    vx: 0, vy: SPEED,
    steps: 0, hits: 0,
    spdMin: Infinity, spdMax: -Infinity,   // speed-invariant audit
    bounces: [],                           // {inAng,nAng,outAng} per obstacle hit
    rng: mulberry32(seed),
    result: null                           // null | 'win' | 'out' | 'timeout'
  };
}
function noteSpeed(b){
  const m = Math.hypot(b.vx, b.vy);
  if (m < b.spdMin) b.spdMin = m;
  if (m > b.spdMax) b.spdMax = m;
}
/** Re-normalise the velocity back to the fixed SPEED. */
function renorm(b){
  const m = Math.hypot(b.vx, b.vy) || 1;
  b.vx = b.vx / m * SPEED;
  b.vy = b.vy / m * SPEED;
}
/* Both the ball and the target are circles now, so the win check is simply
   "is the ball's centre inside the outer ring". */
function inTarget(b, c){
  return Math.hypot(b.x - c.x, b.y - c.y) <= c.r;
}

/** Bounce off a static line segment: mirror the direction about the
    surface normal. The angle changes, the speed never does. Used for
    BOTH player ramps and level walls - identical physics. */
function segmentBounce(b, s, halfT){
  const c = closestOnSeg(b.x, b.y, s.x1, s.y1, s.x2, s.y2);
  let nx = b.x - c.x, ny = b.y - c.y;
  let d = Math.hypot(nx, ny);
  const min = BALL_R + halfT;
  if (d >= min) return false;
  if (d < 1e-6){                          // dead-centre: use the segment's perpendicular
    const ax = s.y2 - s.y1, ay = -(s.x2 - s.x1);
    const am = Math.hypot(ax, ay) || 1;
    nx = ax / am; ny = ay / am;
  } else { nx /= d; ny /= d; }
  const pen = min - d;                    // how far it sank in this substep
  b.x = c.x + nx * min;
  b.y = c.y + ny * min;
  const dot = b.vx*nx + b.vy*ny;
  if (dot < 0){ b.vx -= 2*dot*nx; b.vy -= 2*dot*ny; }
  renorm(b);
  // Re-spend the travel the push-out just undid, along the new heading.
  b.x += b.vx / SPEED * pen;
  b.y += b.vy / SPEED * pen;
  return true;
}

function resolveCollisions(b, lv, ramps, walls){
  /* The board has no walls - the ball is free to leave by any edge, which
     ends the run. Only ramps, level walls and obstacles change its direction. */
  for (let i = 0; i < ramps.length; i++)  segmentBounce(b, ramps[i], RAMP_HT);
  for (let i = 0; i < walls.length; i++)  segmentBounce(b, walls[i], WALL_HT);

  /* red obstacles: mirror off the circle, then scatter */
  for (let i = 0; i < lv.obstacles.length; i++){
    const o = lv.obstacles[i];
    let nx = b.x - o.x, ny = b.y - o.y;
    let d = Math.hypot(nx, ny);
    const min = BALL_R + o.r;
    if (d < min){
      if (d < 1e-6){ nx = 0; ny = -1; } else { nx /= d; ny /= d; }
      b.x = o.x + nx * (min + 0.5);         // nudge clear so we can't re-trigger
      b.y = o.y + ny * (min + 0.5);
      const inAng = Math.atan2(b.vy, b.vx);
      const dot = b.vx*nx + b.vy*ny;
      let bx = b.vx, by = b.vy;
      if (dot < 0){ bx = b.vx - 2*dot*nx; by = b.vy - 2*dot*ny; }
      let a = Math.atan2(by, bx) + (b.rng()*2 - 1) * OB_JITTER;
      const nAng = Math.atan2(ny, nx);
      let rel = a - nAng;
      rel = Math.atan2(Math.sin(rel), Math.cos(rel));   // wrap to [-PI, PI]
      if (rel >  OB_MAX_DEV) rel =  OB_MAX_DEV;
      else if (rel < -OB_MAX_DEV) rel = -OB_MAX_DEV;
      a = nAng + rel;
      b.bounces.push({ inAng: inAng, nAng: nAng, outAng: a });
      b.vx = Math.cos(a) * SPEED;
      b.vy = Math.sin(a) * SPEED;
      b.hits++;
      renorm(b);
    }
  }
}

/** Advance one 1/60s step. Sets b.result when the run ends. */
function stepBall(b, lv, ramps){
  // the target (and any walls bolted to it) are re-evaluated every step from
  // the elapsed motion clock, so a moving target is tracked, never snapshotted
  const t = b.t0 + b.steps / 60;
  const c = targetAt(lv, t);
  const walls = lv.move ? buildWalls(lv, c) : lv.walls;
  for (let i = 0; i < SUBSTEPS; i++){
    b.vy += GRAV_BIAS / SUBSTEPS;   // direction nudge, spread across the step...
    renorm(b);                      // ...speed immediately restored
    b.x += b.vx / SUBSTEPS;
    b.y += b.vy / SUBSTEPS;
    resolveCollisions(b, lv, ramps, walls);
    noteSpeed(b);
    if (inTarget(b, c)) { b.result = 'win'; b.hitX = c.x; b.hitY = c.y; return; }
    if (b.x < -BALL_R || b.x > W + BALL_R ||
        b.y < -BALL_R || b.y > H + BALL_R) { b.result = 'out'; return; }
  }
  b.steps++;
  if (b.steps >= MAX_STEPS) b.result = 'timeout';
}

/** Run a whole drop headlessly and report the outcome. */
function simulate(ramps, seed, levelIdx, t0){
  const lv = LEVELS[levelIdx === undefined ? levelIndex : levelIdx];
  const b = makeBall(lv, seed >>> 0, t0 || 0);
  while (!b.result) stepBall(b, lv, ramps);
  return { result: b.result, steps: b.steps, hits: b.hits,
           spdMin: b.spdMin, spdMax: b.spdMax, secs: b.steps / 60,
           bounces: b.bounces, x: b.x, y: b.y };
}

/* ============================================================
   PROGRESS (localStorage)
   ============================================================ */
const SAVE_KEY = 'gtb.progress.v1';
function loadHighest(){
  try {
    const v = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return clamp(v.highest | 0, 0, LEVELS.length - 1);
  } catch (e){ return 0; }
}
function saveHighest(i){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ highest: i })); }
  catch (e){ /* private mode / blocked storage - progress just won't persist */ }
}

/* ============================================================
   GAME STATE
   ============================================================ */
let levelIndex = 0;
let highest    = 0;
let phase  = 'plan';    // 'plan' | 'drop' | 'over'
let ramps  = [];
let draft  = null;
let ball   = null;
let seedOverride = null;

const canvas  = document.getElementById('board');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const card    = document.getElementById('card');
const elLeft  = document.getElementById('ramps-left');
const elTitle = document.getElementById('level-title');
const elHint  = document.getElementById('hint');
const btnDrop = document.getElementById('btn-drop');
const btnUndo = document.getElementById('btn-undo');
const btnClear= document.getElementById('btn-clear');
const btnNext = document.getElementById('btn-next');

const dpr = Math.min(window.devicePixelRatio || 1, 3);
canvas.width  = W * dpr;
canvas.height = H * dpr;
ctx.scale(dpr, dpr);

function level(){ return LEVELS[levelIndex]; }

function syncUI(){
  const lv = level();
  const planning = phase === 'plan';
  elTitle.innerHTML = 'Level ' + lv.id + ' <span>&mdash; ' + lv.name + '</span>';
  if (typeof selPanel !== 'undefined' && !selPanel.hidden) buildGrid();
  elLeft.textContent = lv.maxBlocks - ramps.length;
  btnDrop.disabled  = !planning;
  btnUndo.disabled  = !planning || ramps.length === 0;
  btnClear.disabled = !planning || ramps.length === 0;
  if (phase === 'drop' || phase === 'capture') elHint.textContent = 'Watching the drop…';
  else if (phase === 'over') elHint.textContent = 'Retry replays the same ramps. Adjust lets you redraw.';
  else if (ramps.length >= lv.maxBlocks)
    elHint.textContent = 'No ramps left — undo one to redraw, or drop the ball.';
  else elHint.textContent = 'Drag on the board to draw a ramp, then press Drop Ball.';
}

function setLevel(i){
  levelIndex = clamp(i, 0, LEVELS.length - 1);
  ramps = []; draft = null; ball = null; capture = null;
  phase = 'plan'; overlay.hidden = true;
  if (levelIndex > highest){ highest = levelIndex; saveHighest(highest); }
  syncUI();
}

/* ---------------- input: mouse + touch via pointer events ---------------- */
function toBoard(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: clamp((e.clientX - r.left) * (W / r.width), 0, W),
    y: clamp((e.clientY - r.top)  * (H / r.height), 0, H)
  };
}
function truncate(p, q){
  const dx = q.x - p.x, dy = q.y - p.y;
  const len = Math.hypot(dx, dy);
  if (len <= MAX_RAMP) return q;
  return { x: p.x + dx / len * MAX_RAMP, y: p.y + dy / len * MAX_RAMP };
}

canvas.addEventListener('pointerdown', function(e){
  if (phase !== 'plan' || ramps.length >= level().maxBlocks) return;
  canvas.setPointerCapture(e.pointerId);
  const p = toBoard(e);
  draft = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
  e.preventDefault();
});
canvas.addEventListener('pointermove', function(e){
  if (!draft) return;
  const p = truncate({ x: draft.x1, y: draft.y1 }, toBoard(e));
  draft.x2 = p.x; draft.y2 = p.y;
  e.preventDefault();
});
function endDraft(){
  if (!draft) return;
  const len = Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1);
  if (len >= MIN_RAMP && ramps.length < level().maxBlocks) ramps.push(draft);
  draft = null;
  syncUI();
}
canvas.addEventListener('pointerup',     function(e){ endDraft(); e.preventDefault(); });
canvas.addEventListener('pointercancel', function(){ draft = null; });

/* ---------------- actions ---------------- */
function drop(){
  if (phase !== 'plan') return;
  draft = null; capture = null;
  const seed = seedOverride !== null ? seedOverride : (Math.random() * 0x7fffffff) | 0;
  ball  = makeBall(level(), seed);
  phase = 'drop';
  overlay.hidden = true;
  syncUI();
}
/* A win is swallowed by the target first; the overlay waits for the animation. */
function land(result){
  if (result !== 'win'){ finish(result); return; }
  const c = targetAt(level(), ball.t0 + ball.steps / 60);
  phase = 'capture';
  capture = { t: 0, bx: ball.x, by: ball.y, cx: c.x, cy: c.y };
  syncUI();
}
function finish(result){
  phase = 'over';
  const win  = result === 'win';
  const last = levelIndex >= LEVELS.length - 1;
  if (win && !last && levelIndex + 1 > highest){ highest = levelIndex + 1; saveHighest(highest); }
  card.className = 'card ' + (win ? 'win' : 'lose');
  document.getElementById('ov-title').textContent = win ? 'Target hit!' : 'Missed';
  document.getElementById('ov-sub').textContent =
    win ? (last ? 'That was the last level for now.' : 'On to level ' + LEVELS[levelIndex+1].id + '.')
        : result === 'timeout' ? 'The ball bounced too long without landing.'
        : 'The ball left the board without reaching the target.';
  btnNext.hidden = !win || last;
  overlay.hidden = false;
  syncUI();
}
btnDrop.addEventListener('click', drop);
btnUndo.addEventListener('click', function(){ if (phase === 'plan'){ ramps.pop(); syncUI(); } });
btnClear.addEventListener('click', function(){ if (phase === 'plan'){ ramps = []; syncUI(); } });
document.getElementById('btn-retry').addEventListener('click', function(){
  phase = 'plan'; overlay.hidden = true; drop();
});
document.getElementById('btn-adjust').addEventListener('click', function(){
  phase = 'plan'; ball = null; overlay.hidden = true; syncUI();
});
btnNext.addEventListener('click', function(){ setLevel(levelIndex + 1); });

/* ---------------- level select ---------------- */
const selPanel = document.getElementById('select');
const lvGrid   = document.getElementById('lvgrid');
function buildGrid(){
  lvGrid.innerHTML = '';
  for (let i = 0; i < LEVELS.length; i++){
    const b = document.createElement('button');
    b.textContent = LEVELS[i].id;
    b.disabled = i > highest;                       // locked past your best
    if (i < highest) b.className = 'done';
    if (i === levelIndex) b.className = 'cur';
    b.title = b.disabled ? 'Locked' : LEVELS[i].name;
    b.addEventListener('click', function(){ setLevel(i); selPanel.hidden = true; });
    lvGrid.appendChild(b);
  }
  document.getElementById('sel-sub').textContent =
    'Unlocked ' + (highest + 1) + ' of ' + LEVELS.length + '. Clear a level to open the next.';
}
elTitle.addEventListener('click', function(){ buildGrid(); selPanel.hidden = false; });
document.getElementById('btn-close-sel').addEventListener('click', function(){ selPanel.hidden = true; });

/* ============================================================
   RENDERING
   ============================================================ */
const STEP_MS     = 1000 / 60;
const CAPTURE_MS  = 620;      // length of the "swallowed" animation
const TARGET_MOTES  = 6;      // motes at fixed angles, breathing in and out
const TARGET_PULSE_S = 1.9;   // seconds per outward pulse ring
let last = performance.now(), acc = 0;
let clock = 0;                // seconds since load - drives all target motion
let capture = null;           // {t, bx, by, cx, cy} while the capture plays
const lastDraw = { x: 0, y: 0 };          // where the ball was actually painted

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function drawSeg(s, color, halfT, glow){
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = color;
  ctx.lineWidth = halfT * 2;
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = 10; }
  ctx.beginPath();
  ctx.moveTo(s.x1, s.y1);
  ctx.lineTo(s.x2, s.y2);
  ctx.stroke();
  ctx.restore();
}

function render(){
  const lv = level();

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#141936');
  g.addColorStop(1, '#0b0e1e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  ctx.lineWidth = 1;
  for (let y = 50; y < H; y += 50){
    ctx.beginPath(); ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); ctx.stroke();
  }

  const c = targetAt(lv, clock);

  /* ---- target: a bullseye portal. Concentric rings, a pulsing core, a
     slowly counter-rotating outer ring and a few drifting motes, so it reads
     as "land here" and stays alive even before the ball is dropped. ---- */
  const pulse = 0.5 + 0.5 * Math.sin(clock * 2.3);

  ctx.save();
  ctx.translate(c.x, c.y);

  // soft halo
  const halo = ctx.createRadialGradient(0, 0, c.r * 0.15, 0, 0, c.r * 1.55);
  halo.addColorStop(0,   'rgba(47,217,122,' + (0.30 + pulse * 0.16) + ')');
  halo.addColorStop(0.55,'rgba(47,217,122,0.10)');
  halo.addColorStop(1,   'rgba(47,217,122,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0, 0, c.r * 1.55, 0, Math.PI * 2); ctx.fill();

  // outer ring - dashed and fixed; nothing here rotates
  ctx.save();
  ctx.strokeStyle = 'rgba(47,217,122,.95)';
  ctx.lineWidth = 3;
  ctx.setLineDash([11, 8]);
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // breathing pulse ring: expands outward and fades, then repeats. Radial
  // motion only - it never spins.
  const bk = (clock % TARGET_PULSE_S) / TARGET_PULSE_S;
  ctx.strokeStyle = 'rgba(120,255,180,' + (1 - bk) * 0.5 + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(0, 0, c.r * (0.55 + bk * 0.75), 0, Math.PI * 2); ctx.stroke();

  // middle ring
  ctx.strokeStyle = 'rgba(47,217,122,.55)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, c.r * 0.66, 0, Math.PI * 2); ctx.stroke();

  // inner ring + pulsing core
  ctx.fillStyle = 'rgba(47,217,122,.16)';
  ctx.beginPath(); ctx.arc(0, 0, c.r * 0.66, 0, Math.PI * 2); ctx.fill();
  ctx.save();
  ctx.shadowColor = 'rgba(47,217,122,.9)';
  ctx.shadowBlur = 10 + pulse * 14;
  ctx.fillStyle = 'rgba(120,255,180,' + (0.75 + pulse * 0.25) + ')';
  ctx.beginPath(); ctx.arc(0, 0, c.r * (0.20 + pulse * 0.05), 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // motes sit at FIXED angles and breathe in and out along their radius -
  // radial drift, never an orbit
  for (let i = 0; i < TARGET_MOTES; i++){
    const a  = i * (Math.PI * 2 / TARGET_MOTES) + 0.4;
    const rr = c.r * 1.18 + Math.sin(clock * 1.5 + i * 1.9) * (c.r * 0.14);
    ctx.fillStyle = 'rgba(150,255,195,' + (0.28 + 0.34 * (0.5 + 0.5*Math.sin(clock*2 + i))) + ')';
    ctx.beginPath(); ctx.arc(Math.cos(a)*rr, Math.sin(a)*rr, 2.3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  /* capture shockwave - expanding rings when the ball is swallowed */
  if (capture){
    const k = capture.t / CAPTURE_MS;
    for (let i = 0; i < 3; i++){
      const kk = k - i * 0.16;
      if (kk <= 0 || kk >= 1) continue;
      ctx.save();
      ctx.strokeStyle = 'rgba(120,255,180,' + (1 - kk) * 0.85 + ')';
      ctx.lineWidth = 3 * (1 - kk) + 0.5;
      ctx.beginPath();
      ctx.arc(capture.cx, capture.cy, c.r * (0.5 + kk * 1.5), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* static walls - structural, not player-placed. Rebuilt from the target's
     live centre so they travel with a moving target. */
  const liveWalls = lv.move ? buildWalls(lv, c) : lv.walls;
  for (let i = 0; i < liveWalls.length; i++)
    drawSeg(liveWalls[i], '#93a0b8', WALL_HT, 'rgba(0,0,0,.5)');

  /* obstacles */
  for (let i = 0; i < lv.obstacles.length; i++){
    const o = lv.obstacles[i];
    ctx.save();
    ctx.shadowColor = 'rgba(255,77,94,.55)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ff4d5e';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.30)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r - 7, 0, Math.PI * 2); ctx.stroke();
  }

  /* ramps */
  for (let i = 0; i < ramps.length; i++) drawSeg(ramps[i], '#3ec8ff', RAMP_HT, 'rgba(62,200,255,.55)');
  if (draft){
    const len = Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1);
    drawSeg(draft, len < MIN_RAMP ? 'rgba(62,200,255,.45)' : '#3ec8ff', RAMP_HT, null);
  }

  /* spawn marker (planning only) */
  if (phase === 'plan'){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.setLineDash([4, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(lv.spawn.x, lv.spawn.y + 14);
    ctx.lineTo(lv.spawn.x, lv.spawn.y + 78);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(lv.spawn.x, lv.spawn.y, BALL_R + 4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  /* ball - drawn between the last two physics states, so motion stays smooth
     on high-refresh displays where rAF outruns the fixed 60Hz simulation. */
  let b = ball || lv.spawn;
  let rad = BALL_R, alpha = 1;
  if (ball && phase === 'drop'){
    const a = acc / STEP_MS;
    b = { x: ball.px + (ball.x - ball.px) * a,
          y: ball.py + (ball.y - ball.py) * a };
  } else if (capture){
    // swallowed: slide to the centre while shrinking and fading out
    const k = Math.min(1, capture.t / (CAPTURE_MS * 0.55));
    const e = k * k * (3 - 2 * k);
    b = { x: capture.bx + (capture.cx - capture.bx) * e,
          y: capture.by + (capture.cy - capture.by) * e };
    rad = BALL_R * (1 - e);
    alpha = 1 - e;
  }
  lastDraw.x = b.x; lastDraw.y = b.y;
  if (rad > 0.2){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = 'rgba(255,255,255,.65)';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, rad, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* ---------------- fixed-timestep loop ---------------- */
function frame(now){
  let dt = now - last;
  last = now;
  if (dt > 250) dt = 250;               // tab was backgrounded
  clock += dt / 1000;                   // keeps running in every phase, so the
                                        // target animates while you are planning
  if (phase === 'drop' && ball){
    acc += dt;
    while (acc >= STEP_MS){
      acc -= STEP_MS;
      ball.px = ball.x; ball.py = ball.y;
      stepBall(ball, level(), ramps);
      if (ball.result){ land(ball.result); break; }
    }
  } else {
    acc = 0;
  }

  if (capture){
    capture.t += dt;
    if (capture.t >= CAPTURE_MS){ capture = null; finish('win'); }
  }

  render();
  requestAnimationFrame(frame);
}

highest = loadHighest();
setLevel(highest);
requestAnimationFrame(frame);

/* ============================================================
   TEST HOOK - used by the Playwright suite / solver sweep.
   ============================================================ */
window.__gtb = {
  LEVELS: LEVELS,
  CONSTS: { W:W, H:H, BALL_R:BALL_R, SPEED:SPEED, GRAV_BIAS:GRAV_BIAS, CURVE:CURVE,
            SUBSTEPS:SUBSTEPS, OB_JITTER:OB_JITTER, OB_MAX_DEV:OB_MAX_DEV,
            MIN_RAMP:MIN_RAMP, MAX_RAMP:MAX_RAMP, RAMP_HT:RAMP_HT, WALL_HT:WALL_HT,
            CAPTURE_MS:CAPTURE_MS },
  simulate: simulate,
  buildWalls: buildWalls,
  targetAt: targetAt,
  clock: function(){ return clock; },   // lets tests build any target type on any level
  state: function(){
    const lv = level();
    return { phase: phase, levelIndex: levelIndex, levelId: lv.id, highest: highest,
             ramps: ramps.map(function(r){ return Object.assign({}, r); }),
             maxBlocks: lv.maxBlocks, rampsLeft: lv.maxBlocks - ramps.length,
             walls: (lv.move ? buildWalls(lv, targetAt(lv, clock)) : lv.walls).length,
             targetType: lv.targetType, moving: !!lv.move,
             target: targetAt(lv, clock), capturing: !!capture,
             result: ball ? ball.result : null,
             ball: ball ? { x: ball.x, y: ball.y, px: ball.px, py: ball.py,
                            speed: Math.hypot(ball.vx, ball.vy) } : null,
             draw: { x: lastDraw.x, y: lastDraw.y } };
  },
  setSeed:  function(s){ seedOverride = s === null ? null : (s >>> 0); },
  setRamps: function(list){ ramps = list.map(function(r){ return Object.assign({}, r); }); syncUI(); },
  setLevel: setLevel,
  openSelect: function(){ buildGrid(); selPanel.hidden = false; },
  clearProgress: function(){ try { localStorage.removeItem(SAVE_KEY); } catch (e){} highest = 0; },
  reset: function(){ ramps = []; ball = null; draft = null;
                     phase = 'plan'; overlay.hidden = true; syncUI(); }
};
})();
</script>
