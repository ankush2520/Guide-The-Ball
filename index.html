<title>Guide the Ball</title>
<style>
/* KetuGames boot loader - painted before any script runs, removed by main.tsx */
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
      background:linear-gradient(180deg,#8fd3ff 0%,#cfe8ff 55%,#ffe9d2 100%);transition:opacity .4s ease;
      -webkit-user-select:none;user-select:none}
#boot.done{opacity:0;pointer-events:none}
#boot .bm{width:min(170px,40vw);animation:btbob .9s ease-in-out infinite alternate}
#boot .bw{width:min(280px,72vw);margin-top:-6px}
#boot .bb{width:min(200px,56vw);height:16px;margin-top:10px;box-sizing:border-box;border:3px solid #2a2350;border-radius:10px;
          background:#fff;overflow:hidden;box-shadow:0 3px 0 #2a2350}
#boot .bb i{display:block;height:100%;width:6%;border-radius:6px;background:linear-gradient(90deg,#ffc14a,#ff6a1a);
            animation:btfill 2.6s cubic-bezier(.2,.7,.3,1) forwards}
#boot.done .bb i{width:100%;animation:none}
@keyframes btbob{from{transform:translateY(8px) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
@keyframes btfill{to{width:90%}}
@media (prefers-reduced-motion:reduce){#boot .bm,#boot .bb i{animation:none}#boot .bb i{width:60%}}
</style>
