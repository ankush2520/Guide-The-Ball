<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, -apple-system, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f1ff"/><stop offset="1" stop-color="#eee9fb"/></linearGradient>
    <linearGradient id="rub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb14a"/><stop offset="1" stop-color="#f07a12"/></linearGradient>
    <radialGradient id="ball" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff1b8"/><stop offset="1" stop-color="#ffc53a"/></radialGradient>
    <g id="bouncy">
      <!-- legs -->
      <line x1="-44" y1="4" x2="-50" y2="20" stroke="#2a2350" stroke-width="3" stroke-linecap="round"/>
      <line x1="44" y1="4" x2="50" y2="20" stroke="#2a2350" stroke-width="3" stroke-linecap="round"/>
      <!-- coil springs under the mat -->
      <path d="M-28 4 l4 8 l4 -8 l4 8 l4 -8" fill="none" stroke="#8a8fb0" stroke-width="2"/>
      <path d="M12 4 l4 8 l4 -8 l4 8 l4 -8" fill="none" stroke="#8a8fb0" stroke-width="2"/>
      <!-- rubber mat -->
      <rect x="-56" y="-7" width="112" height="14" rx="7" fill="url(#rub)" stroke="#2a2350" stroke-width="3"/>
      <line x1="-40" y1="-1" x2="-30" y2="-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <line x1="-20" y1="-1" x2="-10" y2="-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <line x1="0" y1="-1" x2="10" y2="-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
      <line x1="20" y1="-1" x2="30" y2="-1" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
    </g>
  </defs>

  <!-- ===== 1: the button ===== -->
  <text x="150" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2350">1. Tap "Bouncy"</text>
  <rect x="20" y="45" width="260" height="340" rx="18" fill="url(#sky)" stroke="#2a2350" stroke-width="3"/>
  <!-- HUD -->
  <rect x="32" y="58" width="236" height="40" rx="20" fill="#fff" stroke="#2a2350" stroke-width="2"/>
  <rect x="42" y="66" width="70" height="24" rx="12" fill="#eaf3ff" stroke="#1680f0" stroke-width="2"/>
  <line x1="52" y1="82" x2="72" y2="74" stroke="#1680f0" stroke-width="5" stroke-linecap="round"/>
  <text x="96" y="83" text-anchor="middle" font-size="13" font-weight="700" fill="#2a2350">×2</text>
  <rect x="120" y="64" width="96" height="28" rx="14" fill="#ffe2bf" stroke="#f07a12" stroke-width="3"/>
  <rect x="130" y="74" width="30" height="8" rx="4" fill="url(#rub)" stroke="#2a2350" stroke-width="1.5"/>
  <text x="190" y="83" text-anchor="middle" font-size="13" font-weight="800" fill="#b8430a">×1</text>
  <circle cx="186" cy="100" r="0" />
  <path d="M168 128 l18 -26 l6 20 z" fill="#2a2350"/>
  <text x="150" y="160" text-anchor="middle" font-size="13" fill="#2a2350">Bouncy ramps you own</text>
  <text x="150" y="178" text-anchor="middle" font-size="13" fill="#2a2350">(button glows when armed)</text>
  <circle cx="70" cy="230" r="9" fill="url(#ball)" stroke="#2a2350" stroke-width="2"/>
  <text x="70" y="258" text-anchor="middle" font-size="11" fill="#6b6690">ball</text>
  <circle cx="210" cy="320" r="18" fill="#2fc95a" stroke="#2a2350" stroke-width="3"/>
  <circle cx="210" cy="320" r="8" fill="#fff" stroke="#2a2350" stroke-width="2"/>

  <!-- ===== 2: draw it ===== -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2350">2. Draw it like any ramp</text>
  <rect x="320" y="45" width="260" height="340" rx="18" fill="url(#sky)" stroke="#2a2350" stroke-width="3"/>
  <!-- normal ramp -->
  <line x1="350" y1="130" x2="440" y2="170" stroke="#2a2350" stroke-width="11" stroke-linecap="round"/>
  <line x1="350" y1="130" x2="440" y2="170" stroke="#1680f0" stroke-width="6" stroke-linecap="round"/>
  <text x="395" y="198" text-anchor="middle" font-size="12" fill="#0d5fb8">normal ramp (blue)</text>
  <!-- bouncy ramp -->
  <g transform="translate(470 290) rotate(-22)"><use href="#bouncy"/></g>
  <text x="470" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#b8430a">bouncy ramp (orange trampoline)</text>
  <!-- finger -->
  <circle cx="525" cy="262" r="9" fill="none" stroke="#2a2350" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="540" y="248" font-size="11" fill="#6b6690">drag</text>

  <!-- ===== 3: boing ===== -->
  <text x="750" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2a2350">3. Boing! Ball flies off fast</text>
  <rect x="620" y="45" width="260" height="340" rx="18" fill="url(#sky)" stroke="#2a2350" stroke-width="3"/>
  <!-- incoming path -->
  <path d="M660 90 Q 670 220 700 300" fill="none" stroke="#9aa3c7" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- squashed trampoline -->
  <g transform="translate(715 318) rotate(-20) scale(1 .7)"><use href="#bouncy"/></g>
  <!-- speed trail -->
  <path d="M722 300 Q 780 190 842 120" fill="none" stroke="#ffb14a" stroke-width="9" stroke-linecap="round" opacity=".35"/>
  <path d="M722 300 Q 780 190 842 120" fill="none" stroke="#f07a12" stroke-width="3" stroke-linecap="round"/>
  <line x1="770" y1="232" x2="756" y2="226" stroke="#f07a12" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="790" y1="200" x2="776" y2="192" stroke="#f07a12" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="846" cy="114" r="9" fill="url(#ball)" stroke="#2a2350" stroke-width="2"/>
  <text x="655" y="290" font-size="22" font-weight="900" fill="#f07a12" transform="rotate(-10 655 290)">BOING!</text>
  <circle cx="842" cy="176" r="18" fill="#2fc95a" stroke="#2a2350" stroke-width="3"/>
  <circle cx="842" cy="176" r="8" fill="#fff" stroke="#2a2350" stroke-width="2"/>
  <text x="750" y="370" text-anchor="middle" font-size="12" fill="#2a2350">~4× the speed of a normal ramp</text>

  <text x="450" y="410" text-anchor="middle" font-size="13" fill="#6b6690">Only used up if you win · same physics as today's spring, so every level still works</text>
</svg>
